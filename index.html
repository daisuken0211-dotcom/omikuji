<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ARおみくじ（HandLandmarker方式・安定版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module">
  import {
    FilesetResolver,
    HandLandmarker
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
</script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    font-size: 20px;
  }
  #result {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 20;
  }
  #paper {
    background: #fff;
    color: #000;
    border-radius: 16px;
    padding: 24px;
    width: 300px;
    text-align: center;
  }
  #paper h2 {
    color: #d60000;
    margin: 0 0 10px;
  }
</style>
</head>

<body>

<div id="start">タップして開始</div>
<canvas id="canvas"></canvas>

<div id="result">
  <div id="paper">
    <h2 id="r_title"></h2>
    <div id="r_health"></div>
    <div id="r_work"></div>
    <div id="r_message"></div>
  </div>
</div>

<script type="module">
/* ==========================
   基本セットアップ
========================== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const video = document.createElement("video");
video.playsInline = true;

let handLandmarker;
let hands = [];

const cards = [];
let selected = false;

/* ==========================
   おみくじデータ
========================== */
const omikuji = await fetch("omikuji.json").then(r => r.json());

/* ==========================
   HandLandmarker 初期化
========================== */
async function initHandLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-tasks/hand_landmarker/hand_landmarker.task",
    },
    numHands: 1,
    runningMode: "VIDEO"
  });
}

/* ==========================
   手の更新（完全移植）
========================== */
function updateHands(results) {
  hands = [];
  if (!results || !results.landmarks) return;

  const w = canvas.width;
  const h = canvas.height;

  for (const hand of results.landmarks) {
    const idx = [0, 5, 9, 13, 17];
    let sx = 0, sy = 0;
    for (const i of idx) {
      sx += hand[i].x;
      sy += hand[i].y;
    }
    const cx = (1 - sx / idx.length) * w;
    const cy = (sy / idx.length) * h;
    hands.push({ x: cx, y: cy, r: 50 });
  }
}

/* ==========================
   おみくじ札
========================== */
function spawnCards() {
  if (selected) return;
  for (let i = 0; i < 2; i++) {
    cards.push({
      x: 80 + Math.random() * (canvas.width - 160),
      y: -100,
      vy: canvas.height / 2,
      r: 40
    });
  }
}

setInterval(spawnCards, 2000);

/* ==========================
   メインループ
========================== */
let lastTime = null;

function loop(t) {
  if (!lastTime) lastTime = t;
  const dt = (t - lastTime) / 1000;
  lastTime = t;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* ミラー描画 */
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  /* 手描画 */
  for (const h of hands) {
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,255,0,0.9)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  /* 札更新 */
  for (let i = cards.length - 1; i >= 0; i--) {
    const c = cards[i];
    c.y += c.vy * dt;

    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();

    ctx.fillStyle = "#d60000";
    ctx.font = "18px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("おみくじ", c.x, c.y);

    /* 当たり判定 */
    for (const h of hands) {
      if (Math.hypot(c.x - h.x, c.y - h.y) < c.r + h.r) {
        choose();
        return;
      }
    }

    if (c.y - c.r > canvas.height) {
      cards.splice(i, 1);
    }
  }

  requestAnimationFrame(loop);
}

/* ==========================
   結果表示
========================== */
function choose() {
  if (selected) return;
  selected = true;
  cards.length = 0;

  const pick = omikuji[Math.floor(Math.random() * omikuji.length)];
  document.getElementById("r_title").textContent = pick.title;
  document.getElementById("r_health").textContent = "健康：" + pick.health;
  document.getElementById("r_work").textContent = "仕事：" + pick.work;
  document.getElementById("r_message").textContent = pick.message;
  document.getElementById("result").style.display = "flex";
}

/* ==========================
   開始処理
========================== */
document.getElementById("start").onclick = async () => {
  document.getElementById("start").remove();
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: 1280, height: 720 }
  });
  video.srcObject = stream;
  await video.play();
  await initHandLandmarker();

  setInterval(() => {
    const now = performance.now();
    const res = handLandmarker.detectForVideo(video, now);
    updateHands(res);
  }, 100);

  requestAnimationFrame(loop);
};
</script>

</body>
</html>
