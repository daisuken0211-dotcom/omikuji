<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR風 触って選ぶおみくじ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- MediaPipe Tasks Vision -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
  }

  #canvas {
    position: fixed;
    inset: 0;
  }

  h1 {
    position: fixed;
    top: 8px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
    text-shadow: 0 0 8px black;
    z-index: 5;
    pointer-events: none;
  }

  .card {
    position: absolute;
    width: 80px;
    height: 120px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #d60000;
    z-index: 4;
    animation: fall 2s linear forwards;
    user-select: none;
  }

  @keyframes fall {
    from { transform: translateY(-150px); opacity: 0; }
    to   { transform: translateY(120vh); opacity: 1; }
  }

  #result {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #paper {
    background: white;
    padding: 24px;
    border-radius: 16px;
    width: 300px;
    text-align: center;
  }

  .title {
    font-size: 26px;
    color: #d60000;
    margin-bottom: 10px;
    font-weight: bold;
  }

  .item {
    margin: 6px 0;
    font-size: 15px;
  }
</style>
</head>

<body>

<h1>✋ ひらひら落ちるおみくじに触れてください ✋</h1>
<canvas id="canvas"></canvas>

<div id="result">
  <div id="paper">
    <div class="title" id="r_title"></div>
    <div class="item" id="r_health"></div>
    <div class="item" id="r_work"></div>
    <div class="item" id="r_message"></div>
  </div>
</div>

<script>
(async () => {

  /* ===== 基本セットアップ ===== */
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;

  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  /* ===== HandLandmarker ===== */
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );

  const handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task"
    },
    numHands: 1,
    runningMode: "video"
  });

  /* ===== おみくじ ===== */
  const res = await fetch("omikuji.json");
  const omikuji = await res.json();

  let cards = [];
  let selected = false;

  function spawnCards() {
    if (selected) return;

    for (let i = 0; i < 2; i++) {
      const c = document.createElement("div");
      c.className = "card";
      c.textContent = "おみくじ";
      c.style.left = Math.random() * (window.innerWidth - 80) + "px";
      c.style.top = "-140px";
      document.body.appendChild(c);
      cards.push(c);

      c.addEventListener("animationend", () => {
        c.remove();
        cards = cards.filter(x => x !== c);
      });
    }
  }

  setInterval(spawnCards, 2000);

  function choose(card) {
    if (selected) return;
    selected = true;
    cards.forEach(c => c.remove());
    cards = [];

    const pick = omikuji[Math.floor(Math.random() * omikuji.length)];
    r_title.textContent = pick.title;
    r_health.textContent = "健康： " + pick.health;
    r_work.textContent   = "仕事： " + pick.work;
    r_message.textContent = "一言： " + pick.message;
    result.style.display = "flex";
  }

  /* ===== メインループ ===== */
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 鏡表示でカメラ描画
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();

    const now = performance.now();
    const results = handLandmarker.detectForVideo(video, now);

    if (!selected && results.landmarks && results.landmarks.length > 0) {
      const finger = results.landmarks[0][8]; // 人差し指先
      const x = (1 - finger.x) * canvas.width;
      const y = finger.y * canvas.height;

      // デバッグ用指表示
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fill();

      cards.forEach(c => {
        const r = c.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        if (Math.hypot(x - cx, y - cy) < 60) {
          choose(c);
        }
      });
    }

    requestAnimationFrame(loop);
  }

  loop();
})();
</script>

</body>
</html>
