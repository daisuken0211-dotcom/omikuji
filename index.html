<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ARおみくじ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: system-ui, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
}

/* 開始説明 */
#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #fff;
  text-align: center;
  line-height: 1.6;
  font-size: 18px;
  z-index: 10;
  padding: 20px;
}

/* 残り枚数 */
#counter {
  position: fixed;
  top: 16px;
  left: 16px;
  font-size: 28px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
  border-radius: 12px;
  z-index: 15;
  pointer-events: none;
}

/* 結果 */
#result {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.6);
  z-index: 20;
}

#paper {
  background: #fff;
  color: #000;
  border-radius: 16px;
  padding: 24px;
  width: 300px;
  text-align: center;
}

#paper h2 {
  color: #d60000;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div id="start">
  タップして開始。<br>
  落ちてくるおみくじから1枚選んで<br>
  手で触りましょう。
</div>

<div id="counter">残り 20 枚</div>

<canvas id="canvas"></canvas>

<div id="result">
  <div id="paper">
    <h2 id="r_title"></h2>
    <div id="r_health"></div>
    <div id="r_work"></div>
    <div id="r_message"></div>
  </div>
</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

/* ===== 基本 ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const video = document.createElement("video");
video.playsInline = true;

const counterEl = document.getElementById("counter");

let handLandmarker;
let hands = [];
let cards = [];
let selected = false;
let gameStarted = false;

/* ===== おみくじ ===== */
let omikuji = await fetch("omikuji.json").then(r => r.json());
omikuji = omikuji.sort(() => Math.random() - 0.5);

const MAX_OMIKUJI = 20;
let usedCount = 0;      // 消えた枚数
let omikujiIndex = 0;  // 生成順

/* ===== HandLandmarker ===== */
async function initHand() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-tasks/hand_landmarker/hand_landmarker.task"
    },
    numHands: 1,
    runningMode: "VIDEO"
  });
}

/* ===== 手更新 ===== */
function updateHands(res) {
  hands = [];
  if (!res || !res.landmarks) return;

  for (const h of res.landmarks) {
    const idx = [0, 5, 9, 13, 17];
    let sx = 0, sy = 0;
    for (const i of idx) {
      sx += h[i].x;
      sy += h[i].y;
    }
    hands.push({
      x: (1 - sx / idx.length) * canvas.width,
      y: (sy / idx.length) * canvas.height,
      r: 60
    });
  }
}

/* ===== 残り枚数 ===== */
function updateCounter() {
  counterEl.textContent = `残り ${MAX_OMIKUJI - usedCount} 枚`;
}

/* ===== おみくじ生成 ===== */
function spawn() {
  if (!gameStarted) return;
  if (selected) return;
  if (omikujiIndex >= MAX_OMIKUJI) return;
  if (cards.length >= 2) return;

  cards.push({
    data: omikuji[omikujiIndex++],
    x: Math.random() * (canvas.width - 160) + 80,
    y: -120,
    vy: canvas.height / 3.5,
    sway: Math.random() * 2 + 1,
    angle: Math.random() * Math.PI,
    w: 70,
    h: 120
  });
}

/* 落下間隔 */
setInterval(spawn, 1500);

/* ===== ループ ===== */
let last = null;
function loop(t) {
  if (!last) last = t;
  const dt = (t - last) / 1000;
  last = t;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ミラー映像
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  // 手
  for (const h of hands) {
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,255,0,0.9)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // おみくじ
  for (let i = cards.length - 1; i >= 0; i--) {
    const c = cards[i];
    c.y += c.vy * dt;
    c.angle += dt;

    const fx = c.x + Math.sin(c.angle * c.sway) * 40;

    ctx.save();
    ctx.translate(fx, c.y);
    ctx.rotate(Math.sin(c.angle) * 0.3);
    ctx.fillStyle = "#fff";
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.strokeStyle = "#d60000";
    ctx.strokeRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.fillStyle = "#d60000";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("おみくじ", 0, 0);
    ctx.restore();

    // 当たり判定
    for (const h of hands) {
      if (Math.hypot(fx - h.x, c.y - h.y) < h.r) {
        choose(c.data);
        return;
      }
    }

    // 画面下で消えたらカウント減少
    if (c.y > canvas.height + 150) {
      cards.splice(i, 1);
      usedCount++;
      updateCounter();
    }
  }

  requestAnimationFrame(loop);
}

/* ===== 結果 ===== */
function choose(p) {
  if (selected) return;
  selected = true;
  cards = [];

  r_title.textContent = p.title;
  r_health.textContent = "健康：" + p.health;
  r_work.textContent = "仕事：" + p.work;
  r_message.textContent = p.message;
  result.style.display = "flex";
}

/* ===== 開始 ===== */
start.onclick = async () => {
  start.remove();
  gameStarted = true;
  updateCounter();

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: 1280, height: 720 }
  });
  video.srcObject = stream;
  await video.play();

  await initHand();

  setInterval(() => {
    const now = performance.now();
    updateHands(handLandmarker.detectForVideo(video, now));
  }, 100);

  requestAnimationFrame(loop);
};
</script>

</body>
</html>
