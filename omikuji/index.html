<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR風 手で選ぶおみくじ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #000;
  }
  video {
    position: fixed;
    inset: 0;
    object-fit: cover;
    z-index: 0;
  }
  h1 {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 2;
    text-shadow: 0 0 8px black;
  }
  #field {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
  .card {
    position: absolute;
    top: -200px;
    width: 120px;
    height: 180px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: #d60000;
    cursor: pointer;
    user-select: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    from { transform: translateY(0); opacity: 0; }
    to   { transform: translateY(120vh); opacity: 1; }
  }
  #result {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  #paper {
    background: white;
    border-radius: 16px;
    padding: 24px;
    width: 300px;
    text-align: center;
  }
  .title {
    font-size: 28px;
    color: #d60000;
    margin-bottom: 12px;
  }
  .item {
    margin: 8px 0;
    font-size: 16px;
  }
</style>
</head>

<body>

<h1>✋ 手を握って おみくじを選ぼう ✋</h1>
<video id="video" autoplay muted playsinline></video>
<div id="field"></div>

<div id="result">
  <div id="paper">
    <div class="title" id="r_title"></div>
    <div class="item" id="r_health"></div>
    <div class="item" id="r_work"></div>
    <div class="item" id="r_message"></div>
  </div>
</div>

<script>
let omikuji = [];
let cards = [];
let selected = false;

// JSON読み込み
fetch("omikuji.json").then(r => r.json()).then(j => {
  omikuji = j;
  spawnCards();
});

// 札生成
function spawnCards() {
  const field = document.getElementById("field");
  for (let i = 0; i < 5; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerText = "おみくじ";
    c.style.left = Math.random() * (window.innerWidth - 120) + "px";
    c.style.animationDuration = (6 + Math.random() * 3) + "s";
    c.onclick = () => choose(c);
    field.appendChild(c);
    cards.push(c);
  }
}

// 結果表示
function choose(card) {
  if (selected) return;
  selected = true;
  cards.forEach(c => c.remove());
  const pick = omikuji[Math.floor(Math.random() * omikuji.length)];
  r_title.innerText = pick.title;
  r_health.innerText = "健康： " + pick.health;
  r_work.innerText   = "仕事： " + pick.work;
  r_message.innerText = "一言： " + pick.message;
  result.style.display = "flex";
}

// ==== 手の検出（スマホ用）====
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  const video = document.getElementById("video");
  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });

  hands.onResults(res => {
    if (selected) return;
    if (!res.multiHandLandmarks) return;

    const lm = res.multiHandLandmarks[0];
    if (isFist(lm)) {
      chooseNearest();
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640,
    height: 480
  });
  camera.start();

  // グー判定
  function isFist(lm) {
    const palm = lm[0];
    const tips = [8,12,16,20];
    let close = 0;
    tips.forEach(i => {
      const dx = lm[i].x - palm.x;
      const dy = lm[i].y - palm.y;
      if (Math.sqrt(dx*dx + dy*dy) < 0.08) close++;
    });
    return close >= 3;
  }

  function chooseNearest() {
    let min = Infinity;
    let target = null;
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      const d = Math.abs(r.left + r.width/2 - window.innerWidth/2);
      if (d < min) {
        min = d;
        target = c;
      }
    });
    if (target) choose(target);
  }
} else {
  // PC（カメラなし）
  document.getElementById("video").style.display = "none";
}
</script>

</body>
</html>
