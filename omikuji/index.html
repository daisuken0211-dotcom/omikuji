<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR風 触って選ぶおみくじ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }

  video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  h1 {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 3;
    text-shadow: 0 0 8px black;
    font-size: 18px;
  }

  #field {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .card {
    position: absolute;
    top: -120px;
    width: 80px;
    height: 120px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: #d60000;
    user-select: none;
    pointer-events: auto;
    animation: fall 2s linear forwards;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 1; }
    100% {
      transform: translateY(120vh) translateX(40px) rotate(20deg);
      opacity: 1;
    }
  }

  #result {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  #paper {
    background: white;
    border-radius: 16px;
    padding: 24px;
    width: 300px;
    text-align: center;
  }

  .title {
    font-size: 26px;
    color: #d60000;
    margin-bottom: 10px;
  }

  .item {
    margin: 6px 0;
    font-size: 15px;
  }
</style>
</head>

<body>

<h1>✋ ひらひら落ちるおみくじに触れてください ✋</h1>
<video id="video" autoplay muted playsinline></video>
<div id="field"></div>

<div id="result">
  <div id="paper">
    <div class="title" id="r_title"></div>
    <div class="item" id="r_health"></div>
    <div class="item" id="r_work"></div>
    <div class="item" id="r_message"></div>
  </div>
</div>

<script>
let omikuji = [];
let cards = [];
let selected = false;
let handPos = null;

// JSON
fetch("omikuji.json").then(r => r.json()).then(j => {
  omikuji = j;
  spawnLoop();
});

// 2枚ずつ落とす
function spawnLoop() {
  spawnCards(2);
  setTimeout(spawnLoop, 2000);
}

function spawnCards(n) {
  const field = document.getElementById("field");
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerText = "おみくじ";
    c.style.left = Math.random() * (window.innerWidth - 80) + "px";
    c.onclick = () => choose(c);
    field.appendChild(c);
    cards.push(c);
  }
}

function choose(card) {
  if (selected) return;
  selected = true;
  cards.forEach(c => c.remove());

  const pick = omikuji[Math.floor(Math.random() * omikuji.length)];
  r_title.innerText = pick.title;
  r_health.innerText = "健康： " + pick.health;
  r_work.innerText = "仕事： " + pick.work;
  r_message.innerText = "一言： " + pick.message;
  result.style.display = "flex";
}

// ===== 手検出（触れたらOK）=====
if (navigator.mediaDevices) {
  const video = document.getElementById("video");
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });

  hands.onResults(res => {
    if (selected) return;
    if (!res.multiHandLandmarks) return;

    const tip = res.multiHandLandmarks[0][8]; // 人差し指先
    handPos = {
      x: (1 - tip.x) * window.innerWidth,
      y: tip.y * window.innerHeight
    };

    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      if (
        handPos.x > r.left &&
        handPos.x < r.right &&
        handPos.y > r.top &&
        handPos.y < r.bottom
      ) {
        choose(c);
      }
    });
  });

  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640,
    height: 480
  });
  cam.start();
} else {
  video.style.display = "none";
}
</script>

</body>
</html>
